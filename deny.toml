# cargo-deny configuration for mempool-scanner.

[advisories]
ignore = [
  # crypto-bigint v0.5.5: timing variability (RUSTSEC-2026-0387).
  # Upstream fix is in v0.7.6 but revm 43.0.3 pins crypto-bigint 0.5.5;
  # upgrading revm is out of scope for this release.
  "RUSTSEC-2026-0387",
  # paste v1.0.15: unmaintained (RUSTSEC-2024-0436).
  # No safe upgrade available; used transitively by alloy/syn.
  "RUSTSEC-2024-0436",
]
unmaintained = "all"
yanked = "deny"

[bans]
skip = []

[licenses]
# Allow common permissive licenses used by the dependency tree.
# Each entry is a single SPDX license identifier (no OR / WITH / slash
# operators). cargo-deny evaluates each license in a crate's expression
# against this list, so dual-licensed crates (e.g. "MIT OR Apache-2.0")
# are covered when both "MIT" and "Apache-2.0" are listed.
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-3-Clause",
  "BSD-2-Clause",
  "CC0-1.0",
  "0BSD",
  "Zlib",
  "Unicode-3.0",
  "Unlicense",
  "ISC",
  "CDLA-Permissive-2.0",
]

[sources]

[graph]

targets = []
