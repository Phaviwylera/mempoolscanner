name: Deploy to mempolscan in Ohio

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: mempolscan-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the commit being deployed
        uses: actions/checkout@v7

      - name: Run Python API unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Configure Rust & musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools pkg-config
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-unknown-linux-musl

      - name: Run Rust unit & Revm integration tests
        run: cargo test --all-targets

      - name: Build static Linux release binary & publish build artifact release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          GITHUB_SHA="${COMMIT_SHA}" cargo build --release --target x86_64-unknown-linux-musl
          cp target/x86_64-unknown-linux-musl/release/mempool-scanner mempool-scanner-linux-x86_64
          ./mempool-scanner-linux-x86_64 --version
          sha256sum mempool-scanner-linux-x86_64 > mempool-scanner-linux-x86_64.sha256

          TAG="build-${COMMIT_SHA}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" mempool-scanner-linux-x86_64 mempool-scanner-linux-x86_64.sha256 --clobber
          else
            gh release create "$TAG" mempool-scanner-linux-x86_64 mempool-scanner-linux-x86_64.sha256 \
              --prerelease \
              --title "Automated build ${COMMIT_SHA}" \
              --notes "Static x86_64-unknown-linux-musl mempool-scanner binary for EC2 deployment."
          fi

          gh release list --limit 30 --json tagName --jq '.[].tagName' \
            | grep '^build-' \
            | tail -n +6 \
            | while IFS= read -r old_tag; do
                gh release delete "$old_tag" --yes --cleanup-tag || true
              done

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the commit being deployed
        uses: actions/checkout@v7

      - name: Obtain short-lived AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::835756673190:role/mempolscan-github-deploy
          aws-region: us-east-2
          role-session-name: mempolscan-${{ github.run_id }}

      - name: Deploy this commit through Systems Manager
        env:
          INSTANCE_ID: i-0873e11dd856a2a1d
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          command_id="$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$INSTANCE_ID" \
            --comment "Deploy mempoolscanner ${COMMIT_SHA}" \
            --timeout-seconds 3600 \
            --parameters "commands=sudo /usr/local/sbin/mempolscan-deploy ${COMMIT_SHA}" \
            --query 'Command.CommandId' --output text)"
          echo "SSM command: ${command_id}"
          aws ssm wait command-executed --command-id "$command_id" --instance-id "$INSTANCE_ID" || true
          invocation="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --output json)"
          echo "$invocation" | jq -r '.StandardOutputContent'
          status="$(echo "$invocation" | jq -r '.Status')"
          if [[ "$status" != "Success" ]]; then
            err_out="$(echo "$invocation" | jq -r '.StandardErrorContent')"
            std_out="$(echo "$invocation" | jq -r '.StandardOutputContent')"
            echo "$err_out" >&2
            python3 -c 'import sys; [print("::error::"+l[:350]) for l in sys.stdin.read().splitlines()[-20:] if l.strip()]' <<<"${std_out}"$'\n'"${err_out}"
            exit 1
          fi

      - name: Verify the deployed instance
        env:
          INSTANCE_ID: i-0873e11dd856a2a1d
          HITS_DEADLINE_SECONDS: "180"
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          command_id="$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$INSTANCE_ID" \
            --comment "Verify mempoolscanner endpoints and observations ${COMMIT_SHA:-}" \
            --timeout-seconds 900 \
            --parameters "commands=bash /opt/mempoolscanner/deploy/verify_release.sh ${HITS_DEADLINE_SECONDS}" \
            --query 'Command.CommandId' --output text)"
          echo "SSM command: ${command_id}"
          aws ssm wait command-executed --command-id "$command_id" --instance-id "$INSTANCE_ID" || true
          invocation="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --output json)"
          echo "$invocation" | jq -r '.StandardOutputContent'
          status="$(echo "$invocation" | jq -r '.Status')"
          if [[ "$status" != "Success" ]]; then
            echo "Verification finished with status: ${status}" >&2
            err_out="$(echo "$invocation" | jq -r '.StandardErrorContent')"
            std_out="$(echo "$invocation" | jq -r '.StandardOutputContent')"
            echo "$err_out" >&2
            python3 -c 'import sys; [print("::error::"+l[:350]) for l in sys.stdin.read().splitlines()[-20:] if l.strip()]' <<<"${std_out}"$'\n'"${err_out}"
            exit 1
          fi
