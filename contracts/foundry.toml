[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false
# Cancun, not shanghai: mainnet forks past the Cancun hard fork execute
# TLOAD/TSTORE/MCOPY, and Aave V3's pool uses transient storage. Under
# shanghai the flash loan aborted immediately with EvmError: NotActivated.
evm_version = "cancun"
fs_permissions = [{ access = "read", path = "./" }]

[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"
sepolia = "${SEPOLIA_RPC_URL}"
