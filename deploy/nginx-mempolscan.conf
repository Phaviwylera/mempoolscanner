server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # The Vite dashboard (web-dash/dist). Build it with:
    #   cd /opt/mempoolscanner/web-dash && npm ci && npm run build
    root /opt/mempoolscanner/web-dash/dist;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; font-src 'self'; base-uri 'none'; frame-ancestors 'none'" always;

    # ---------------------------------------------------------------------
    # JSON API.
    #
    # Two backends on purpose:
    #   127.0.0.1:8765  the Python observer API  (hits / quality / liquidations)
    #   127.0.0.1:3000  the Rust axum API        (opportunities / simulate)
    #
    # /api/liquidations stays on Python because it carries more positions and
    # live INR conversion; the Rust build hardcodes usd_inr. Flip the
    # proxy_pass below to port 3000 to serve the Chainlink-backed fx instead.
    # ---------------------------------------------------------------------
    location = /api/hits {
        proxy_pass http://127.0.0.1:8765/hits;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
    }

    location = /api/quality {
        proxy_pass http://127.0.0.1:8765/quality;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
    }

    location = /api/liquidations {
        proxy_pass http://127.0.0.1:8765/liquidations;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
    }

    # Live keeper state, from the Rust API.
    location = /api/opportunities {
        proxy_pass http://127.0.0.1:3000/api/opportunities;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
    }

    # revm fork simulation. Prefix match: the address is a path parameter, and
    # the method is POST. A fork simulation does real RPC work, so the read
    # timeout is raised well above the nginx default of 60s.
    location /api/simulate/ {
        proxy_pass http://127.0.0.1:3000/api/simulate/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        add_header Cache-Control "no-store" always;
    }

    # ---------------------------------------------------------------------
    # Static
    # ---------------------------------------------------------------------

    # Vite emits content-hashed filenames, so these are safe to cache hard.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # The previous vanilla UI, kept reachable rather than deleted.
    location /legacy/ {
        alias /opt/mempoolscanner/web/;
        try_files $uri $uri/ /legacy/index.html;
        add_header Cache-Control "no-cache" always;
    }

    # SPA fallback. `=404` would break any client-side route and, more
    # immediately, serves nothing for a deep link. Security headers are
    # repeated here because an add_header in a location block replaces the
    # server-level set rather than adding to it.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; font-src 'self'; base-uri 'none'; frame-ancestors 'none'" always;
    }
}
