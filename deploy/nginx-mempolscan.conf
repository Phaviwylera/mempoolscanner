server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /opt/mempoolscanner/web;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; font-src 'self'; base-uri 'none'; frame-ancestors 'none'" always;

    location = /api/hits {
        proxy_pass http://127.0.0.1:8765/hits;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
    }

    location = /api/quality {
        proxy_pass http://127.0.0.1:8765/quality;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }
}

